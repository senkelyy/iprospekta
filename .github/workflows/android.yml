name: Build I-Prospekta

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # permet de lancer le build a la main depuis l'onglet Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Les runners ubuntu-latest ont deja le SDK Android ; on accepte les
      # licences et on installe explicitement les composants requis.
      - name: Install Android SDK components
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID SDK = $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          echo "sdkmanager = $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # --- APK de demonstration (debug, auto-signe) : toujours produit ---
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iprospekta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publie l'APK dans la branche "apk" pour pouvoir le recuperer via Git.
      - name: Publish APK to apk branch
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK = $APK"
          cp "$APK" "$RUNNER_TEMP/iprospekta-debug.apk"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/iprospekta-debug.apk" ./iprospekta-debug.apk
          git add iprospekta-debug.apk
          git commit -m "APK debug build ${GITHUB_SHA}"
          git push -f origin apk

      # --- Build signe release (APK + AAB) : seulement si un keystore est fourni ---
      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK and AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload release artifacts
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: iprospekta-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
