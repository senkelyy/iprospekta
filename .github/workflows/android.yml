name: Build I-Prospekta

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # permet de lancer le build a la main depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Renseignez ces secrets dans Settings > Secrets > Actions pour un build signe.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # --- APK de demonstration (debug, auto-signe) : toujours produit ---
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iprospekta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # --- Build signe release (APK + AAB) : seulement si un keystore est fourni ---
      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK and AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload release artifacts
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: iprospekta-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
